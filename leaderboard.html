<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard - Pokemon Desktop Online</title>
  <link rel="icon" href="assets/logo-240.png" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JXF30KLMDF"></script>
  <script>

    gtag('config', 'G-JXF30KLMDF');

<body>
  <header>
    <div class="brand"><img src="assets/logo-240.png" alt="logo" /> Pokemon Desktop Online</div>
    <nav class="site-nav">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="play.html" data-i18n="nav_play">Play</a>
      <a href="leaderboard.html" data-i18n="nav_leaderboard">Leaderboard</a>
      <a href="account.html" data-i18n="nav_account">Login / Sync</a>
    </nav>
    <div class="nav-controls">
      <select class="lang-select" aria-label="Language">
        <option value="en">EN</option>
        <option value="pt">PT</option>
        <option value="es">ES</option>
        <option value="de">DE</option>
      </select>
      <button class="hamburger-btn" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>
    <h1 data-i18n="leaderboard_title">Top streaks</h1>
    <div class="card">
      <table class="leaderboard-table">
        <thead>
          <tr><th data-i18n="leaderboard_col_trainer">Trainer</th><th data-i18n="leaderboard_col_streak">Streak</th><th data-i18n="leaderboard_col_date">Date</th></tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <button id="footer-logout-btn" class="footer-logout" hidden data-i18n="dashboard_logout_btn">Log out</button>
    <p><span data-i18n="footer_text">Pokemon Desktop Online - Barba Productions</span> - Instagram: <a href="https://www.instagram.com/barba.productions/" target="_blank" rel="noopener">@barbaproductions</a></p>

  <script src="js/i18n.js"></script>
